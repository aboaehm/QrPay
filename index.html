<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دَفعة</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #17202a; }
    .container { max-width: 600px; margin: auto; padding: 16px; }
    .card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    h1, h2, h3 { margin-bottom: 12px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; margin-bottom: 10px; }
    button { background: #17202a; color: white; border: none; cursor: pointer; }
    button.secondary { background: #e9edf1; color: #17202a; }
    .wallet-item { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .hidden { display: none; }
    .qr-container { text-align: center; margin: 20px 0; }
    #qrcode img { margin: auto; }
    .link-box { background: #f0f5ff; padding: 10px; border-radius: 8px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <!-- شاشة تسجيل الدخول / التسجيل -->
    <div id="authScreen" class="card hidden">
      <h2>تسجيل الدخول للتاجر</h2>
      <input type="email" id="email" placeholder="البريد الإلكتروني">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button onclick="login()">دخول</button>
      <button class="secondary" onclick="signup()">إنشاء حساب جديد</button>
    </div>

    <!-- لوحة تحكم التاجر -->
    <div id="dashboard" class="hidden">
      <h2>لوحة التحكم</h2>
      <p>أهلاً <span id="userEmail"></span> <button class="secondary" onclick="logout()" style="width:auto">تسجيل خروج</button></p>
      <div class="card">
        <h3>بيانات المتجر</h3>
        <label>اسم المتجر</label>
        <input type="text" id="merchantName">
        <label>رقم الهاتف (اختياري)</label>
        <input type="tel" id="merchantPhone">
      </div>
      <div class="card">
        <h3>المحافظ</h3>
        <div id="walletsList"></div>
        <button class="secondary" onclick="addWallet()">+ إضافة محفظة</button>
        <button onclick="saveData()">حفظ البيانات</button>
      </div>
      <div class="card">
        <h3>رابط صفحتك للعملاء</h3>
        <div class="link-box" id="publicLink"></div>
        <div class="qr-container"><div id="qrcode"></div></div>
      </div>
    </div>

    <!-- صفحة العميل (تظهر عند فتح رابط معين) -->
    <div id="customerView" class="hidden">
      <div class="card">
        <h2 id="customerMerchantName">اسم المتجر</h2>
        <div id="customerWallets"></div>
      </div>
    </div>
  </div>

  <script>
    // ========== ضع بيانات Firebase الخاصة بك هنا ==========
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    // =====================================================

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let merchantData = null;

    // تحقق من وجود مستخدم مسجل
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('userEmail').textContent = user.email;
        loadMerchantData();
      } else {
        currentUser = null;
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
      }
    });

    // دوال المصادقة
    function signup() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => { /* تم */ })
        .catch(err => alert(err.message));
    }

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => { /* تم */ })
        .catch(err => alert(err.message));
    }

    function logout() {
      auth.signOut();
    }

    // دوال قاعدة البيانات
    function loadMerchantData() {
      if (!currentUser) return;
      db.collection('merchants').doc(currentUser.uid).get().then(doc => {
        if (doc.exists) {
          merchantData = doc.data();
          document.getElementById('merchantName').value = merchantData.name || '';
          document.getElementById('merchantPhone').value = merchantData.phone || '';
          renderWallets();
          generatePublicLink();
        } else {
          merchantData = { name: '', phone: '', wallets: [] };
          saveData(); // إنشاء مستند فارغ
        }
      });
    }

    function saveData() {
      if (!currentUser) return;
      const name = document.getElementById('merchantName').value.trim();
      const phone = document.getElementById('merchantPhone').value.trim();
      const wallets = [];
      document.querySelectorAll('.wallet-item').forEach(item => {
        const type = item.querySelector('select').value;
        const number = item.querySelector('input[type="text"]').value.trim();
        if (type && number) wallets.push({ type, number });
      });
      merchantData = { name, phone, wallets, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      db.collection('merchants').doc(currentUser.uid).set(merchantData)
        .then(() => { alert('تم الحفظ بنجاح'); generatePublicLink(); })
        .catch(err => alert('خطأ: ' + err.message));
    }

    function addWallet() {
      const div = document.createElement('div');
      div.className = 'wallet-item';
      div.innerHTML = `
        <select>
          <option value="يمن والت">يمن والت</option>
          <option value="كاش">كاش</option>
          <option value="موبايل موني">موبايل موني</option>
          <option value="محفظتي">محفظتي</option>
          <option value="شمول تم">شمول تم</option>
        </select>
        <input type="text" placeholder="رقم المحفظة">
        <button class="secondary" onclick="this.parentElement.remove()">حذف</button>
      `;
      document.getElementById('walletsList').appendChild(div);
    }

    function renderWallets() {
      const container = document.getElementById('walletsList');
      container.innerHTML = '';
      if (merchantData && merchantData.wallets) {
        merchantData.wallets.forEach(w => {
          const div = document.createElement('div');
          div.className = 'wallet-item';
          div.innerHTML = `
            <select>
              ${['يمن والت','كاش','موبايل موني','محفظتي','شمول تم'].map(t => `<option ${t===w.type?'selected':''}>${t}</option>`).join('')}
            </select>
            <input type="text" value="${w.number}">
            <button class="secondary" onclick="this.parentElement.remove()">حذف</button>
          `;
          container.appendChild(div);
        });
      }
    }

    function generatePublicLink() {
      if (!currentUser) return;
      const uid = currentUser.uid;
      const link = `${window.location.origin}/?merchant=${uid}`;
      document.getElementById('publicLink').textContent = link;
      // توليد QR
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: link,
        width: 160,
        height: 160,
      });
    }

    // التعامل مع صفحة العميل (عند فتح رابط معين)
    function handleCustomerView() {
      const params = new URLSearchParams(window.location.search);
      const merchantId = params.get('merchant');
      if (merchantId) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('customerView').classList.remove('hidden');
        db.collection('merchants').doc(merchantId).get().then(doc => {
          if (doc.exists) {
            const data = doc.data();
            document.getElementById('customerMerchantName').textContent = data.name || 'متجر';
            const walletsDiv = document.getElementById('customerWallets');
            walletsDiv.innerHTML = '';
            data.wallets.forEach(w => {
              const div = document.createElement('div');
              div.className = 'wallet-item';
              div.innerHTML = `<strong>${w.type}</strong><br><span dir="ltr">${w.number}</span>`;
              // زر نسخ
              const copyBtn = document.createElement('button');
              copyBtn.textContent = 'نسخ الرقم';
              copyBtn.className = 'secondary';
              copyBtn.onclick = () => {
                navigator.clipboard.writeText(w.number).then(() => {
                  copyBtn.textContent = 'تم النسخ ✓';
                  setTimeout(() => copyBtn.textContent = 'نسخ الرقم', 1500);
                });
              };
              div.appendChild(copyBtn);
              walletsDiv.appendChild(div);
            });
          } else {
            document.getElementById('customerMerchantName').textContent = 'التاجر غير موجود';
          }
        });
      }
    }

    // استدعاء دالة صفحة العميل عند التحميل
    handleCustomerView();
  </script>
</body>
</html>
